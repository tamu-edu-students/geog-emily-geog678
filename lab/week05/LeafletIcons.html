<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Tutorial Three</title>

  <!-- Load Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    /* Make the map fill the page */
    html, body, #map {
      height: 100%;
      margin: 0;
      padding: 0;
    }
  </style>
</head>

<body>

  <!-- Map container -->
  <div id="map"></div>

  <!-- Load Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Your custom icon JS -->
  <script>
    // Create the map
    var map = L.map('map').setView([51.5, -0.09], 13);

    // Base map tiles
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // Custom icon class
    var LeafIcon = L.Icon.extend({
      options: {
        shadowUrl: 'leaf-shadow.png',
        iconSize:     [38, 95],
        shadowSize:   [50, 64],
        iconAnchor:   [22, 94],
        shadowAnchor: [4, 62],
        popupAnchor:  [-3, -76]
      }
    });

    // Create the icons
    var greenIcon = new LeafIcon({iconUrl: 'leaf-green.png'});
    var redIcon   = new LeafIcon({iconUrl: 'leaf-red.png'});
    var orangeIcon = new LeafIcon({iconUrl: 'leaf-orange.png'});

    // Add markers
    L.marker([51.5, -0.09], {icon: greenIcon}).addTo(map)
      .bindPopup("I am a green leaf.");

    L.marker([51.495, -0.083], {icon: redIcon}).addTo(map)
      .bindPopup("I am a red leaf.");

    L.marker([51.49, -0.1], {icon: orangeIcon}).addTo(map)
      .bindPopup("I am an orange leaf.");
  </script>

</body>
</html>
